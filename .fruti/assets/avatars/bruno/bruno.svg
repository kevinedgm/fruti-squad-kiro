<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="uva-icon uva-bruno" aria-hidden="true">
  <style>.uva-bruno{stroke-width:var(--uva-stroke,2)}.uva-bruno--conectar{--uva-bruno-modulo:uva-bruno-trazar;--uva-bruno-entrada:uva-bruno-trazar;--uva-bruno-salida:uva-bruno-trazar}.uva-bruno__modulo{stroke-dasharray:1 1.1;animation:var(--uva-bruno-modulo,none) 340ms cubic-bezier(.2,.6,.3,1) 0ms 1 both}.uva-bruno__entrada{stroke-dasharray:1 1.1;animation:var(--uva-bruno-entrada,none) 180ms cubic-bezier(.3,0,.2,1) 300ms 1 both}.uva-bruno__salida{stroke-dasharray:1 1.1;animation:var(--uva-bruno-salida,none) 180ms cubic-bezier(.3,0,.2,1) 480ms 1 both}@keyframes uva-bruno-trazar{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.uva-bruno--conectar{--uva-bruno-modulo:none;--uva-bruno-entrada:none;--uva-bruno-salida:none}}</style>
  <rect class="uva-bruno__modulo" pathLength="1" x="4" y="3" width="16" height="12" rx="4.5"/>
  <path class="uva-bruno__entrada" pathLength="1" d="M9 21V15"/>
  <path class="uva-bruno__salida" pathLength="1" d="M15 15V21"/>
</svg>
