  <style>.uva-lima{stroke-width:var(--uva-stroke,2)}.uva-lima--validar{--uva-lima-contenedor:uva-lima-trazar;--uva-lima-entrada:uva-lima-trazar;--uva-lima-eje:uva-lima-trazar;--uva-lima-salida:uva-lima-trazar}.uva-lima__contenedor{stroke-dasharray:1 1.1;animation:var(--uva-lima-contenedor,none) 360ms cubic-bezier(.2,.6,.3,1) 0ms 1 both}.uva-lima__entrada{stroke-dasharray:1 1.1;animation:var(--uva-lima-entrada,none) 160ms cubic-bezier(.3,0,.2,1) 300ms 1 both}.uva-lima__eje{stroke-dasharray:1 1.1;animation:var(--uva-lima-eje,none) 220ms cubic-bezier(.3,0,.2,1) 440ms 1 both}.uva-lima__salida{stroke-dasharray:1 1.1;animation:var(--uva-lima-salida,none) 160ms cubic-bezier(.3,0,.2,1) 640ms 1 both}@keyframes uva-lima-trazar{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.uva-lima--validar{--uva-lima-contenedor:none;--uva-lima-entrada:none;--uva-lima-eje:none;--uva-lima-salida:none}}</style>
