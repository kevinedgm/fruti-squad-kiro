<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="uva-icon uva-mora" role="img" aria-label="Mora">
  <style>.uva-mora{stroke-width:var(--uva-stroke,2)}.uva-mora--catalogar{--uva-mora-base:uva-mora-trazar;--uva-mora-documento:uva-mora-trazar;--uva-mora-evidencia:uva-mora-trazar;--uva-mora-registro:uva-mora-trazar}.uva-mora__base{stroke-dasharray:1 1.1;animation:var(--uva-mora-base,none) 200ms cubic-bezier(.2,.6,.3,1) 0ms 1 both}.uva-mora__documento{stroke-dasharray:1 1.1;animation:var(--uva-mora-documento,none) 220ms cubic-bezier(.2,.6,.3,1) 160ms 1 both}.uva-mora__evidencia{stroke-dasharray:1 1.1;animation:var(--uva-mora-evidencia,none) 220ms cubic-bezier(.2,.6,.3,1) 300ms 1 both}.uva-mora__registro{stroke-dasharray:1 1.1;animation:var(--uva-mora-registro,none) 220ms cubic-bezier(.2,.6,.3,1) 440ms 1 both}@keyframes uva-mora-trazar{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.uva-mora--catalogar{--uva-mora-base:none;--uva-mora-documento:none;--uva-mora-evidencia:none;--uva-mora-registro:none}}</style>
