  <circle class="uva-mora__documento" pathLength="1" cx="7.5" cy="13.75" r="2.5"/>
  <circle class="uva-mora__evidencia" pathLength="1" cx="16.5" cy="13.75" r="2.5"/>
  <circle class="uva-mora__registro" pathLength="1" cx="12" cy="5.95" r="2.5"/>
