name: package-test

on:
  push:
    branches: ["main", "codex"]
  pull_request:

jobs:
  theme-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node test/theme.test.cjs
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: python3 -m pip install PyYAML 'jsonschema>=4,<5'
      - run: python3 scripts/validate-codex.py
      - name: Skill visual metadata and self-contained SVGs
        run: python3 scripts/validate-skill-icons.py
      - name: TOML syntax and dated official schema
        run: python3 scripts/validate-codex-toml.py
      - name: Agent versus config schema regression
        run: python3 -m unittest discover -s test -p 'codex_toml_test.py'
      - name: Install browser test tooling
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser clipping and repair regression
        run: npm run test:browser
      - name: Pack package
        run: npm pack
      - name: Install packed package in a clean project
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/fruti-squad-codex-*.tgz
          test -f .codex/agents/fruti-squad.toml
          test -f .codex/agents/bruno.toml
          test -f .agents/skills/bruno/SKILL.md
          test -f .fruti/runtime/bruno.yaml
          test -f .codex/qa/verify-delivery.cjs
          test -f .codex/qa/pre-delivery.md
          npx fruti-squad-codex init --brand '#052a76' --accent '#c2d225' --font 'Poppins, Inter, system-ui, sans-serif'
          test -s .fruti/theme/tokens.css
          test -s .fruti/theme/tokens.json
          npx fruti-squad-codex theme
          mkdir -p src/components
          npx fruti-squad-codex project --framework vue3 --components src/components --css-prefix nsa-ui
          test -s .fruti/project.json
          test -s .codex/qa/project-components.md
          npx fruti-squad-codex project --show
          npx fruti-squad-codex plugin --dry-run
          npx fruti-squad-codex plugin
          test -f .agents/plugins/marketplace.json
          test -f node_modules/fruti-squad-codex/assets/composer-icon.svg
          echo "clean npm install provisioning and plugin registration passed"
