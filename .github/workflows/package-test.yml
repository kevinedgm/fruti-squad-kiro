name: package-test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Pack package
        run: npm pack
      - name: Install packed package in a clean project
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/fruti-squad-kiro-*.tgz
          test -f .kiro/agents/fruti-squad.md
          test -f .kiro/agents/bruno.md
          test -f .kiro/skills/bruno/SKILL.md
          test -f .fruti/runtime/bruno.yaml
          echo "clean npm install provisioning passed"
